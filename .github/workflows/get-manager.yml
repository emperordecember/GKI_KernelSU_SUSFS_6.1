name: GetManager
permissions:
  contents: write  # Allow writing to repository contents (for pushing tags)
  actions: read   # Allows triggering actions

on:
  workflow_call: # This allows this workflow to be called from another workflow
    inputs:
      kernelsu_variant:
        required: true
        type: string
      susfs:
        description: "SUSFS module attachment: enabled / disabled"
        required: false
        type: string
        default: "enabled"
      nomount:
        description: "NoMount module attachment: nomount (hookless) / nomount (ci) / disabled"
        required: false
        type: string
        default: "disabled"
      android_version:
        description: "Legacy (unused): the NoMount metamodule bundles every KMI's LKM"
        required: false
        type: string
        default: ""
      kernel_version:
        description: "Legacy (unused): the NoMount metamodule bundles every KMI's LKM"
        required: false
        type: string
        default: ""
      use_vpnhide:
        description: "Attach VPNHide Next companion (apk + bridge root module) when enabled"
        required: false
        type: boolean
        default: false
    outputs:
      susVer:
        description: "The fetched SUSFS version number"
        value: ${{ jobs.get_ksu_manager.outputs.susVer }}

      ksuVer:
        description: "The calculated KSU version number"
        value: ${{ jobs.get_ksu_manager.outputs.ksuVer }}

jobs:
  get_ksu_manager:
    runs-on: ubuntu-24.04
    outputs:
      # 输出1: KSU版本号
      ksuVer: ${{ steps.get_version.outputs.kversion }}
      # 输出2: SUSFS版本号
      susVer: ${{ steps.get_version.outputs.sversion }}
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: 🧐 Debug Workflow Caller Context
        run: |
          echo "==================== DEBUG CONTEXT ===================="
          echo " "
          echo "EVENT NAME: ${{ github.event_name }}"
          echo " "
          echo "--- CALLER INFORMATION ---"
          echo "  - Caller Repository: ${{ github.caller_repository }}"
          echo "  - Caller Workflow:   ${{ github.caller_workflow }}"
          echo "  - Caller User:       ${{ github.triggering_actor }}"
          echo " "
          echo "--- WORKFLOW & JOB INFORMATION ---"
          echo "  - Current Workflow:  ${{ github.workflow }}"
          echo "  - Current Job ID:    ${{ github.job }}"
          echo "  - Current Run ID:    ${{ github.run_id }}"
          echo "  - Current Run Number:${{ github.run_number }}"
          echo " "
          echo "--- GIT REFERENCE INFORMATION ---"
          echo "  - Git Ref:           ${{ github.ref }}"
          echo "  - Ref Type:          ${{ github.ref_type }}"
          echo " "
          echo "======================================================="

      - name: 安装依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y git curl jq

      - name: 获取 KSU & SUSFS 版本
        id: get_version
        run: |

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "This is the Next variant"
            git clone https://github.com/KernelSU-Next/KernelSU-Next.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "This is the SukiSU variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            echo "This is the SukiSU(40726) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 5da529942987b834c2b02a4819eaa298a8383bf4
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            echo "This is the SukiSU(40548) variant"
            git clone https://github.com/SukiSU-Ultra/SukiSU-Ultra.git KernelSU
            git -C KernelSU checkout 3170a48c508f6330ea636c51835a84573fe56ef5
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
            echo "This is the BakaSU(ReSukiSU) variant"
            git clone https://github.com/Baka-SU/BakaSU.git KernelSU
            # BakaSU now keeps the SUSFS integration in 'main' and no longer
            # publishes 'sync-susfs'; build.yml uses main for every build, so
            # the manager version is computed from the same branch/tree.
            git -C KernelSU checkout main
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "This is the Official"
            git clone https://github.com/tiann/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "XXKSU" ]; then
            echo "This is the XXKSU variant"
            git clone https://github.com/backslashxx/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "RKSU" ]; then
            echo "This is the RKSU variant"
            git clone https://github.com/rsuntk/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "KowSU" ]; then
            echo "This is the KowSU variant"
            git clone https://github.com/KOWX712/KernelSU.git KernelSU
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU (FolkSU)" ]; then
            echo "This is the FinaSU (FolkSU) variant"
            git clone https://github.com/LyraVoid/FinaSU.git KernelSU
          else
            echo "Unknown variant"
            exit 1
          fi

          cd KernelSU

          # 计算KSU版本号
          KSU_GIT_VERSION=$(git rev-list --count HEAD)

          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            KSU_VERSION=$((40000 + KSU_GIT_VERSION - 2815))
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            KSU_VERSION=40726
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            KSU_VERSION=40548
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
            KSU_VERSION=$((30700 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            KSU_VERSION=$((20000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "XXKSU" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "KowSU" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU (FolkSU)" ]; then
            KSU_VERSION=$((30000 + KSU_GIT_VERSION))
          elif [ "${{ inputs.kernelsu_variant }}" == "RKSU" ]; then
            # RKSU hardcodes its version in kernel/Makefile (-DKSU_VERSION=NNNNN)
            KSU_VERSION=$(grep -oE 'DKSU_VERSION=[0-9]+' kernel/Makefile | head -1 | cut -d= -f2)
            [ -n "$KSU_VERSION" ] || KSU_VERSION=32473
          fi
          echo $KSU_VERSION
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

          # 计算SUSFS版本号
          if [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40726)" ]; then
            SUS_VERSION="v2.1.0"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU(40548)" ]; then
            SUS_VERSION="v2.0.0"
          else
            INFO="https://gitlab.com/simonpunk/susfs4ksu/-/raw/gki-android14-6.1/ksu_module_susfs/module.prop\?ref_type\=heads"
            SUS_VERSION=$(curl -s $INFO | awk -F '=' '$1 == "version" { print $2 }')
          fi
          echo $SUS_VERSION

          # 导出这两个值给release
          echo "kversion=$KSU_VERSION" >> $GITHUB_OUTPUT
          echo "sversion=$SUS_VERSION" >> $GITHUB_OUTPUT

      - name: 添加 KernelSU
        id: add_KSU
        continue-on-error: true
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_DIR="SukiSU_40726" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_DIR="SukiSU_40548" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 管理器..."
            mkdir -p "manager-artifacts/$LEGACY_DIR"
            MANAGER_URL=$(curl -fsSL "https://api.github.com/repos/zzh20188/GKI_KernelSU_SUSFS/releases/tags/$LEGACY_RELEASE_TAG" |
              jq -r '.assets[] | select(.name | startswith("SukiSU_") and endswith("-release.apk")) | .browser_download_url' |
              head -n 1)
            if [ -z "$MANAGER_URL" ]; then
              echo "未找到 ${{ inputs.kernelsu_variant }} 管理器下载地址。"
              exit 1
            fi
            curl -fL -o "manager-artifacts/$LEGACY_DIR/${LEGACY_DIR}-release.apk" "$MANAGER_URL"
            exit 0
          fi

          if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
            echo "KernelSU Next..."
            REPO="KernelSU-Next/KernelSU-Next"
            KSUM="manager"
            BRANCH="dev"
          elif [ "${{ inputs.kernelsu_variant }}" == "XXKSU" ]; then
            echo "XXKSU..."
            REPO="backslashxx/KernelSU"
            KSUM="manager"
            BRANCH="master"
          elif [ "${{ inputs.kernelsu_variant }}" == "SukiSU" ]; then
            echo "SukiSU..."
            REPO="SukiSU-Ultra/SukiSU-Ultra"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
            echo "BakaSU(ReSukiSU)..."
            REPO="Baka-SU/BakaSU"
            KSUM="manager"
            # The manager MUST come from the same branch the kernel is built
            # from. BakaSU merged SUSFS into 'main' and removed 'sync-susfs',
            # so main is now the only branch used by build.yml.
            BRANCH="main"
          elif [ "${{ inputs.kernelsu_variant }}" == "Official" ]; then
            echo "KSU..."
            REPO="tiann/KernelSU"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "RKSU" ]; then
            echo "RKSU..."
            REPO="rsuntk/KernelSU"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "KowSU" ]; then
            echo "KowSU..."
            REPO="KOWX712/KernelSU"
            KSUM="manager"
          elif [ "${{ inputs.kernelsu_variant }}" == "FinaSU (FolkSU)" ]; then
            echo "FinaSU (FolkSU)..."
            REPO="LyraVoid/FinaSU"
            KSUM="manager"
          fi

          FILENAME=$([[ "${{ inputs.kernelsu_variant }}" == "Next" ]] && echo "build-manager-ci.yml" || echo "build-manager.yml")


          # 按内核 KSU 版本选择 Manager，避免 APK 版本领先于内核版本
          TARGET_KSU_VERSION="${KSU_VERSION:-}"
          if ! [[ "$TARGET_KSU_VERSION" =~ ^[0-9]+$ ]]; then
            echo "无效的目标 KSU 版本: $TARGET_KSU_VERSION"
            exit 1
          fi

          calculate_run_ksu_version() {
            local head_sha="$1"
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              git -C KernelSU fetch --no-tags origin "$head_sha" >/dev/null 2>&1 || true
            fi
            if ! git -C KernelSU cat-file -e "$head_sha^{commit}" 2>/dev/null; then
              return 1
            fi

            local git_version
            git_version=$(git -C KernelSU rev-list --count "$head_sha")
            case "${{ inputs.kernelsu_variant }}" in
              "SukiSU") echo $((40000 + git_version - 2815)) ;;
              "BakaSU(ReSukiSU)") echo $((30700 + git_version)) ;;
              "Official") echo $((20000 + git_version)) ;;
              "Next") echo $((30000 + git_version)) ;;
              "XXKSU") echo $((30000 + git_version)) ;;
              "KowSU") echo $((30000 + git_version)) ;;
              "FinaSU (FolkSU)") echo $((30000 + git_version)) ;;
              "RKSU") echo 32473 ;;
              *) return 1 ;;
            esac
          }

          get_manager_artifacts() {
            local artifacts="$1"
            if [ "${{ inputs.kernelsu_variant }}" == "Next" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "manager" or .name == "manager-spoofed") | "\(.name)\t\(.archive_download_url)"'
            elif [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
              printf '%s' "$artifacts" | jq -r \
                '.artifacts[] | select(.name == "Manager-release" or .name == "Spoofed-Manager-release") | "\(.name)\t\(.archive_download_url)"'
            else
              printf '%s' "$artifacts" | jq -r --arg needle "$KSUM" \
                '.artifacts[] | select((.name | ascii_downcase) | contains($needle)) | "\(.name)\t\(.archive_download_url)"'
            fi
          }

          DOWNLOAD_LIST=""
          BEST_VERSION=0
          BEST_BUILD_ID=""
          BEST_BRANCH=""
          RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?status=success&per_page=30"
          if [ "${{ inputs.kernelsu_variant }}" == "Next" ] || [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
            # Restrict to the branch the kernel is built from so the manager can
            # never be sourced from a different branch than the kernel driver.
            RUNS_URL="https://api.github.com/repos/$REPO/actions/workflows/$FILENAME/runs?branch=$BRANCH&status=success&per_page=30"
          fi

          echo "开始查找不高于 KSU $TARGET_KSU_VERSION 的 Manager 产物..."
          for PAGE in $(seq 1 10); do
            echo "--------------------------------------------------"
            echo "正在检查第 ${PAGE} 页历史构建..."
            RUNS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" "$RUNS_URL&page=$PAGE")
            RUN_COUNT=$(printf '%s' "$RUNS" | jq '.workflow_runs | length')
            if [ "$RUN_COUNT" -eq 0 ]; then
              break
            fi

            for INDEX in $(seq 0 $((RUN_COUNT - 1))); do
              BUILD_ID=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].id")
              HEAD_SHA=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_sha")
              HEAD_BRANCH=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].head_branch")
              RUN_EVENT=$(printf '%s' "$RUNS" | jq -r ".workflow_runs[$INDEX].event")

              # Never ship a PR build: managers built on pull_request carry a
              # "This is a PR debug build. Do NOT use it in production!" banner
              # and are not the official release manager.
              case "$RUN_EVENT" in
                pull_request*)
                  echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): pull_request build (PR debug manager)"
                  continue
                  ;;
              esac

              RUN_KSU_VERSION=$(calculate_run_ksu_version "$HEAD_SHA" || true)
              if ! [[ "$RUN_KSU_VERSION" =~ ^[0-9]+$ ]]; then
                echo "跳过构建 $BUILD_ID: 无法根据提交 $HEAD_SHA 计算 KSU 版本"
                continue
              fi
              if [ "$RUN_KSU_VERSION" -gt "$TARGET_KSU_VERSION" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): Manager KSU $RUN_KSU_VERSION 高于内核 KSU $TARGET_KSU_VERSION"
                continue
              fi

              ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
                "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")
              CANDIDATE_LIST=$(get_manager_artifacts "$ARTIFACTS")
              if [ -z "$CANDIDATE_LIST" ]; then
                echo "跳过构建 $BUILD_ID ($HEAD_BRANCH): 未找到包含 '$KSUM' 的产物"
                continue
              fi

              if [ -z "$DOWNLOAD_LIST" ] || [ "$RUN_KSU_VERSION" -gt "$BEST_VERSION" ]; then
                DOWNLOAD_LIST="$CANDIDATE_LIST"
                BEST_VERSION="$RUN_KSU_VERSION"
                BEST_BUILD_ID="$BUILD_ID"
                BEST_BRANCH="$HEAD_BRANCH"
                echo "候选 Manager: 构建 $BUILD_ID ($HEAD_BRANCH), KSU $RUN_KSU_VERSION"
              fi

              if [ "$RUN_KSU_VERSION" -eq "$TARGET_KSU_VERSION" ]; then
                break 2
              fi
            done
          done

          if [ -z "$DOWNLOAD_LIST" ]; then
            echo "未获取到 KSU 版本小于等于 $TARGET_KSU_VERSION 的 Manager artifact 下载地址列表。"
            exit 1
          fi
          echo "选择 Manager 构建 $BEST_BUILD_ID ($BEST_BRANCH), KSU $BEST_VERSION"

          # BakaSU(ReSukiSU): the manager APK's versionCode is frozen at build
          # time from the commit its own CI built from. If no build exists yet
          # for the exact kernel commit (same branch), the closest older one is
          # used and the manager trails the kernel driver. Surface it loudly.
          if [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ] && [ "$BEST_VERSION" -ne "$TARGET_KSU_VERSION" ]; then
            echo "::warning::BakaSU(ReSukiSU) manager KSU $BEST_VERSION (build $BEST_BUILD_ID on $BEST_BRANCH) != kernel KSU $TARGET_KSU_VERSION; no same-branch manager build for the kernel commit yet"
          fi

          # 下载并解压所有 Manager 产物
          echo "$DOWNLOAD_LIST" | while IFS=$'\t' read -r NAME URL; do
            SAFE_NAME=$(echo "$NAME" | tr '/ ' '__')
            ZIP_NAME="${{ inputs.kernelsu_variant }}-${SAFE_NAME}(${{ env.KSU_VERSION }}).zip"
            echo "下载 $NAME -> $ZIP_NAME"
            curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$ZIP_NAME" "$URL"
            mkdir -p "manager-artifacts/$SAFE_NAME"
            unzip -o "$ZIP_NAME" -d "manager-artifacts/$SAFE_NAME"
            rm -rf "$ZIP_NAME"
          done

          if [ "${{ inputs.kernelsu_variant }}" == "BakaSU(ReSukiSU)" ]; then
            # BakaSU builds split-ABI APKs (arm64-v8a/x86_64/armeabi-v7a/riscv64)
            # plus a universal one, not a single multi-lib APK. Keep both the
            # arm64-v8a and the universal release APKs, drop debug/other ABIs.
            echo "仅保留 BakaSU(ReSukiSU) arm64-v8a + universal release 管理器..."
            find manager-artifacts -type f -name "*.apk" \
              ! -name "*-arm64-v8a-release.apk" \
              ! -name "*-universal-release.apk" -delete
            find manager-artifacts -type f -name "*debug*.apk" -delete
            if ! find manager-artifacts -type f \( -name "*-arm64-v8a-release.apk" -o -name "*-universal-release.apk" \) | grep -q .; then
              echo "未找到 BakaSU(ReSukiSU) arm64-v8a/universal release 管理器。"
              exit 1
            fi
            find manager-artifacts -type f -name "*.apk" -print
          fi

      - name: 添加 SUSFS 模块
        id: add_SUSFS
        if: inputs.susfs == 'enabled'
        continue-on-error: true
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "SukiSU(40726)") LEGACY_RELEASE_TAG="v2.1.0-r2"; LEGACY_SUSFS_VERSION="v2.1.0" ;;
            "SukiSU(40548)") LEGACY_RELEASE_TAG="v2.0.0-r34"; LEGACY_SUSFS_VERSION="v2.0.0" ;;
            *) LEGACY_RELEASE_TAG="" ;;
          esac
          if [ -n "$LEGACY_RELEASE_TAG" ]; then
            echo "下载 ${{ inputs.kernelsu_variant }} 对应的 SUSFS 模块..."
            mkdir -p susfs-module
            curl -fL -o susfs-module/ksu_module_susfs.zip \
              "https://github.com/zzh20188/GKI_KernelSU_SUSFS/releases/download/$LEGACY_RELEASE_TAG/ksu_module_susfs.zip"
            echo "SUSFS_NAME=$LEGACY_SUSFS_VERSION" >> $GITHUB_ENV
            exit 0
          fi

          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/workflows/build.yml/runs?status=success" |
          jq -r '.workflow_runs[0].id')

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/sidex15/susfs4ksu-module/actions/runs/$BUILD_ID/artifacts")

          DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')

          NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
          echo "SUSFS_NAME=$NAME" >> $GITHUB_ENV
          NAME="susfs-$NAME.zip"

          echo $DOWNLOAD_URL
          echo $NAME
          # 下载 Manager 文件
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$NAME" "$DOWNLOAD_URL"
          echo "$NAME 文件已下载.zip"


          # 解压 artifact zip 获取里面的模块文件
          mkdir -p susfs-module
          unzip "$NAME" -d susfs-temp

          # 检查解压后的内容：如果是散装文件则打包成 zip
          cd susfs-temp
          if ls *.zip 1>/dev/null 2>&1; then
            # 里面已经是 zip 文件，直接移动
            mv *.zip ../susfs-module/
          else
            # 是散装文件，打包成 zip
            zip -r "../susfs-module/ksu_module_susfs.zip" .
          fi
          cd ..
          rm -rf susfs-temp "$NAME"

      - name: 添加 NoMount 模块
        id: add_nomount
        if: inputs.nomount != 'disabled'
        run: |
          if [ "${{ inputs.nomount }}" == "mountify" ]; then
            echo "下载 Mountify 模块 (latest CI from backslashxx/mountify)..."
            echo "::notice::Attaching Mountify metamodule (OverlayFS)"
            REPO="backslashxx/mountify"
          else
            echo "下载 NoMount 模块 (latest CI from maxsteeel/nomount)..."
            case "${{ inputs.nomount }}" in
              "nomount (ci)") echo "::notice::NoMount module from branch: dev"; NOMOUNT_BRANCH="dev" ;;
              *) echo "::notice::NoMount module from branch: master"; NOMOUNT_BRANCH="master" ;;
            esac
            REPO="maxsteeel/nomount"
          fi
          BUILD_ID=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/$REPO/actions/runs?status=success&per_page=1&branch=$NOMOUNT_BRANCH" |
          jq -r '.workflow_runs[0].id')

          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "::warning::module CI run not found, skipping module attachment"
            exit 0
          fi

          ARTIFACTS=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
          "https://api.github.com/repos/$REPO/actions/runs/$BUILD_ID/artifacts")

          # NoMount publishes two kinds of artifacts:
          #   nomount-android14-6.1  -> a bare .ko kernel object
          #   NoMount-v2.2.0-...     -> the actual KernelSU metamodule
          # Only the latter is installable (it has module.prop, userspace
          # tools and all LKMs). Attaching the .ko alone yields a broken
          # "module" that contains just one kernel object.
          # Mountify publishes a single versioned artifact; use it as-is.
          if [ "${{ inputs.nomount }}" == "mountify" ]; then
            NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].name')
            DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[0].archive_download_url')
          else
            NAME=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | startswith("NoMount-")) | .name' | head -n1)
            DOWNLOAD_URL=$(echo "$ARTIFACTS" | jq -r '.artifacts[] | select(.name | startswith("NoMount-")) | .archive_download_url' | head -n1)
            if [ -z "$NAME" ]; then
              echo "::warning::NoMount metamodule artifact (NoMount-*) not found in run $BUILD_ID; skipping module attachment"
              exit 0
            fi
            echo "Selected NoMount metamodule artifact: $NAME"
          fi

          if [ -z "$DOWNLOAD_URL" ] || [ "$DOWNLOAD_URL" == "null" ] || [ -z "$NAME" ] || [ "$NAME" == "null" ]; then
            echo "::warning::module artifact not found, skipping"
            exit 0
          fi

          echo "NOMOUNT_NAME=$NAME" >> $GITHUB_ENV

          ZIP_NAME="nomount-$NAME.zip"
          curl -L -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$ZIP_NAME" "$DOWNLOAD_URL"
          echo "$ZIP_NAME downloaded"

          mkdir -p nomount-module
          unzip "$ZIP_NAME" -d nomount-temp
          cd nomount-temp
          if ls *.zip 1>/dev/null 2>&1; then
            mv *.zip ../nomount-module/
          else
            if [ ! -f module.prop ]; then
              echo "::error::$NAME does not look like an installable KernelSU module (module.prop missing)"
              exit 1
            fi
            echo "Packaging NoMount module: $(grep '^version=' module.prop | cut -d= -f2-)"
            zip -r "../nomount-module/ksu_module_nomount.zip" .
          fi
          cd ..
          rm -rf nomount-temp "$ZIP_NAME"

      - name: Notify on failure
        if: steps.add_KSU.outcome == 'failure'
        run: echo "下载CI构建的KSU失败!"

      - name: 上传APK
        if: steps.add_KSU.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.kernelsu_variant }}-Manager(${{ env.KSU_VERSION }})
          path: |
            manager-artifacts/**/*.apk

      - name: 上传SUSFS模块
        if: steps.add_SUSFS.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: susfs-${{ env.SUSFS_NAME }}
          path: ./susfs-module/*
          if-no-files-found: warn
          # Do not wrap the module zip in another archive: without this GitHub
          # hands the user "zip containing zip". Prefer a single-level download.
          archive: false

      - name: 上传NoMount模块
        if: steps.add_nomount.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: nomount-${{ env.NOMOUNT_NAME }}
          path: ./nomount-module/*
          if-no-files-found: warn
          archive: false

      - name: Download VPNHide Next companion artifacts
        if: inputs.use_vpnhide
        run: |
          set -e
          echo "Fetching latest vpnhide-apk + vpnhide-bridge from soranerai/vpnhide_next CI..."
          # The repo has two workflows: "CI Image" (ci-image.yml, docker
          # artifacts) and "CI" (ci.yml, apk/kmod/bridge). The bare runs
          # endpoint returns CI Image first, whose artifacts are irrelevant
          # -- pin to the CI workflow id so we find vpnhide-apk/bridge.
          BUILD_ID=$(curl -s "https://api.github.com/repos/soranerai/vpnhide_next/actions/workflows/269938877/runs?status=success&per_page=1" \
            | jq -r '.workflow_runs[0].id')
          if [ -z "$BUILD_ID" ] || [ "$BUILD_ID" == "null" ]; then
            echo "::warning::vpnhide_next CI run not found, skipping companion artifacts"
            exit 0
          fi
          mkdir -p vpnhide-companion
          for ART in vpnhide-apk vpnhide-bridge; do
            URL=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
              "https://api.github.com/repos/soranerai/vpnhide_next/actions/runs/$BUILD_ID/artifacts" \
              | jq -r --arg a "$ART" '.artifacts[] | select(.name == $a) | .archive_download_url' | head -1)
            if [ -z "$URL" ] || [ "$URL" == "null" ]; then
              echo "::warning::vpnhide artifact $ART not found in run $BUILD_ID, skipping"
              continue
            fi
            echo "Downloading $ART..."
            curl -sL -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" -o "$ART.zip" "$URL"
            mkdir -p "vpnhide-companion/$ART"
            cd "vpnhide-companion/$ART"
            unzip -o -q "../../$ART.zip"
            cd ../..
            rm -f "$ART.zip"
          done
          ls -la vpnhide-companion/

      - name: 上传VPNHide companion
        if: inputs.use_vpnhide
        uses: actions/upload-artifact@v7
        with:
          name: vpnhide-companion
          path: vpnhide-companion/
          if-no-files-found: ignore
          compression-level: 9
 
