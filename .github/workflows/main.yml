# ========================================
# GKI Kernel Build - Main Entry Point
# ========================================
# This workflow is the project's unified entry point, used to:
# 1. Build GKI kernels for all versions
# 2. Fetch the latest KSU manager
# 3. Collect patch reject files for debugging
# 4. Create a GitHub Release (optional)
# ========================================

name: Build Kernel

# Concurrency control: only one instance runs per branch, a new run cancels the old one
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      # ==================== Release configuration ====================
      release_type:
        description: "Release type"
        type: choice
        options:
          - Actions
          - Pre-Release
          - Release
        default: Actions

      # ==================== KernelSU configuration ====================
      kernelsu_variant:
        description: "KernelSU variant"
        type: choice
        options:
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - Official
          - Next
          - XXKSU
        default: ReSukiSU
      susfs:
        description: "SUSFS mount hiding"
        type: choice
        options:
          - "enabled"
          - "disabled"
        default: "enabled"
      nomount:
        description: "NoMount / Mountify mount hiding (metamodules)"
        type: choice
        options:
          - "nomount"
          - "nomount(hookless)"
          - "mountify"
          - "disabled"
        default: "disabled"

      # ==================== Optional configuration ====================
      version:
        description: "Custom version name (optional)"
        type: string
        default: ""
        required: false
      build_time:
        description: "Custom build time (optional, leave empty = current UTC)"
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
        required: false
      # ==================== Option configuration ====================
      use_kpm:
        description: "KPM support (patched mode not supported yet)"
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (not supported yet)"
      droidspaces:
        description: "Droidspaces container support (5.10~6.6: slot patch, 6.12: on/off)"
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      droidspaces_ntsync:
        description: "Enable NTSync support inside the Droidspaces container (requires Droidspaces)"
        type: boolean
        default: false

      # ==================== Feature switches ====================
      use_zram:
        description: "Enable enhanced ZRAM algorithm"
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG (Baseband Guard, anti-brick)"
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        type: boolean
        default: false
      use_bbrv3:
        description: "Enable BBRv3 TCP congestion control backport (Android 14 - 6.1 build; GKI common path only, warning no-op on Sultan path)"
        type: boolean
        default: false
      use_vpnhide:
        description: "Enable VPNHide Next (LSM-based VPN hiding)"
        type: boolean
        default: false

      # ==================== Build version selection ====================
      build_a12_5_10:
        description: "Android 12 - 5.10"
        type: boolean
        default: false
      build_a13_5_15:
        description: "Android 13 - 5.15"
        type: boolean
        default: false
      build_a14_6_1:
        description: "Android 14 - 6.1"
        type: boolean
        default: false
      build_a15_6_6:
        description: "Android 15 - 6.6"
        type: boolean
        default: false
      build_a16_6_12:
        description: "Android 16 - 6.12"
        type: boolean
        default: false
      build_all:
        description: "Build all versions"
        type: boolean
        default: true

jobs:
  # ==================== Fetch manager ====================
  # Download the latest KernelSU manager APK and SUSFS module
  get-manager:
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide || false }}

  # ==================== Android 12 - 5.10 build ====================
  build-a12-5-10:
    if: inputs.build_a12_5_10 || inputs.build_all
    uses: ./.github/workflows/kernel-a12-5-10.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "Upload all"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # ==================== Android 13 - 5.15 build ====================
  build-a13-5-15:
    if: inputs.build_a13_5_15 || inputs.build_all
    uses: ./.github/workflows/kernel-a13-5-15.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}

      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "Upload all"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # ==================== Android 14 - 6.1 build ====================
  build-a14-6-1:
    if: inputs.build_a14_6_1 || inputs.build_all
    uses: ./.github/workflows/kernel-a14-6-1.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}

      use_bbrv3: ${{ inputs.use_bbrv3 }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}
      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "Upload all"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # ==================== Android 15 - 6.6 build ====================
  build-a15-6-6:
    if: inputs.build_a15_6_6 || inputs.build_all
    uses: ./.github/workflows/kernel-a15-6-6.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}

      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "Upload all"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # ==================== Android 16 - 6.12 build ====================
  build-a16-6-12:
    if: inputs.build_a16_6_12 || inputs.build_all
    uses: ./.github/workflows/kernel-a16-6-12.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}

      droidspaces: ${{ inputs.droidspaces }}
      artifact_upload_mode: "Upload all"
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync }}
      called_from_main: true

  # ==================== Collect patch reject files ====================
  # Aggregate .rej files from all build jobs, to make patch issues easier to debug
  collect-rejects:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    needs:
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12
    steps:
      - name: Download reject files
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts
          pattern: '*-Rejects'

      - name: Process reject files
        run: |
          mkdir -p aio-rejects
          for dir in ./downloaded-artifacts/*-Rejects; do
            [ -d "$dir" ] || continue
            dirname=$(basename "$dir")
            original_name=${dirname%-Rejects}
            mkdir -p "aio-rejects/$original_name"
            cp -r "$dir/." "aio-rejects/$original_name/"
          done
          if [ "$(ls -A aio-rejects 2>/dev/null)" ]; then
            cd aio-rejects && zip -r -q -9 ../AIO-REJ.zip . && cd ..
          fi

      - name: Upload aggregated reject files
        uses: actions/upload-artifact@v6
        with:
          name: AIO-REJ
          path: AIO-REJ.zip
          if-no-files-found: ignore

  # ==================== Create release ====================
  # Create a GitHub Release when release_type is not "Actions"
  # Only runs on the origin repo, forks skip this step
  release:
    if: ${{ always() && !cancelled() && inputs.release_type != 'Actions' && github.repository == 'zzh20188/GKI_KernelSU_SUSFS' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    needs:
      - get-manager
      - build-a12-5-10
      - build-a13-5-15
      - build-a14-6-1
      - build-a15-6-6
      - build-a16-6-12

    # ==================== Environment variables ====================
    env:
      REPO_OWNER: ${{ github.repository_owner }}
      REPO_NAME: ${{ github.event.repository.name }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      # ==================== Set display names ====================
      # Precompute various display names, to simplify later references
      - name: Set display names
        run: |
          # KSU display name
          case "${{ inputs.kernelsu_variant }}" in
            "Next")      KSU_NAME="KernelSU-Next" ;;
            "XXKSU")     KSU_NAME="XXKSU" ;;
            "Official")  KSU_NAME="KernelSU" ;;
            "SukiSU")    KSU_NAME="SukiSU" ;;
            "ReSukiSU")  KSU_NAME="ReSukiSU" ;;
          esac
          echo "KSU_NAME=$KSU_NAME" >> $GITHUB_ENV

          # Version info
          KSU_VER="${{ needs.get-manager.outputs.ksuVer }}"
          SUS_VER="${{ needs.get-manager.outputs.susVer }}"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "SUS_VER=$SUS_VER" >> $GITHUB_ENV

          # Feature-switch display
          echo "LZ4_STATUS=${{ inputs.use_zram && 'enabled' || 'disabled' }}" >> $GITHUB_ENV
          echo "BBG_STATUS=${{ inputs.use_bbg && 'supported' || 'not supported' }}" >> $GITHUB_ENV
          if [[ "${{ inputs.use_kpm }}" == enabled* ]]; then
            echo "KPM_STATUS=supported" >> $GITHUB_ENV
          elif [[ "${{ inputs.use_kpm }}" == patched* ]]; then
            echo "KPM_STATUS=supported (patch not supported yet)" >> $GITHUB_ENV
          else
            echo "KPM_STATUS=disabled" >> $GITHUB_ENV
          fi

          # Hook type
          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] || [ "${{ inputs.kernelsu_variant }}" = "ReSukiSU" ]; then
            echo "HOOK_TYPE=SUSFS Inline Hooks" >> $GITHUB_ENV
          else
            echo "HOOK_TYPE=KPROBE Hooks" >> $GITHUB_ENV
          fi

          # Mount type
          if [ "${{ inputs.kernelsu_variant }}" = "Official" ]; then
            echo "MOUNT_TYPE=OVERLAYFS" >> $GITHUB_ENV
          else
            echo "MOUNT_TYPE=Magic Mount" >> $GITHUB_ENV
          fi

          # Release title
          echo "RELEASE_NAME=GKI Kernel: ${KSU_NAME} ${KSU_VER} + SUSFS ${SUS_VER}" >> $GITHUB_ENV

      # ==================== Verify build status ====================
      # Make sure every selected build job completed successfully
      - name: Verify build status
        run: |
          failed=0
          check_build() {
            local selected="$1" job_name="$2" result="$3"
            if [[ "$selected" == "true" && "$result" != "success" && "$result" != "skipped" ]]; then
              echo "Selected build job $job_name failed (result: $result)"
              failed=1
            fi
          }
          check_build "${{ inputs.build_a12_5_10 || inputs.build_all }}" "build-a12-5-10" "${{ needs.build-a12-5-10.result }}"
          check_build "${{ inputs.build_a13_5_15 || inputs.build_all }}" "build-a13-5-15" "${{ needs.build-a13-5-15.result }}"
          check_build "${{ inputs.build_a14_6_1 || inputs.build_all }}" "build-a14-6-1" "${{ needs.build-a14-6-1.result }}"
          check_build "${{ inputs.build_a15_6_6 || inputs.build_all }}" "build-a15-6-6" "${{ needs.build-a15-6-6.result }}"
          check_build "${{ inputs.build_a16_6_12 || inputs.build_all }}" "build-a16-6-12" "${{ needs.build-a16-6-12.result }}"
          [[ "$failed" -ne 0 ]] && exit 1 || true

      # ==================== Checkout code ====================
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}

      # ==================== Determine KSU ref ====================
      # Determine the upstream KernelSU ref from the actual build logic
      - name: Determine KSU ref
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") BRANCH="main" ;;
            "SukiSU")
              if [ "${{ inputs.susfs }}" != "enabled" ]; then
                BRANCH="main"
              else
                BRANCH="builtin"
              fi
              ;;
            "ReSukiSU") BRANCH="main" ;;
            "Next") BRANCH="dev" ;;
            "XXKSU") BRANCH="master" ;;
            *) echo "Error: unknown variant" >&2; exit 1 ;;
          esac
          echo "KSU_BRANCH=$BRANCH" >> $GITHUB_ENV
          echo "BRANCH_INFO=$BRANCH" >> $GITHUB_ENV

      # ==================== Fetch KernelSU commit info ====================
      # Fetch the Git commit info of the KernelSU version currently in use
      - name: Fetch KernelSU commit info
        run: |
          case "${{ inputs.kernelsu_variant }}" in
            "Official") REPO_URL="https://github.com/tiann/KernelSU.git"; REPO_URL2="tiann/KernelSU" ;;
            "Next") REPO_URL="https://github.com/KernelSU-Next/KernelSU-Next.git"; REPO_URL2="KernelSU-Next/KernelSU-Next" ;;
            "XXKSU") REPO_URL="https://github.com/backslashxx/KernelSU.git"; REPO_URL2="backslashxx/KernelSU" ;;
            "SukiSU") REPO_URL="https://github.com/SukiSU-Ultra/SukiSU-Ultra.git"; REPO_URL2="SukiSU-Ultra/SukiSU-Ultra" ;;
            "ReSukiSU") REPO_URL="https://github.com/ReSukiSU/ReSukiSU.git"; REPO_URL2="ReSukiSU/ReSukiSU" ;;
          esac

          if [ "${{ inputs.kernelsu_variant }}" = "SukiSU" ] && [ -f "config/config" ]; then
            CUSTOM_ENABLED=$(grep "^custom=" config/config | cut -d'=' -f2)
            CUSTOM_COMMIT=$(grep "^sukisu=" config/config | cut -d'=' -f2)
            if [ "$CUSTOM_ENABLED" = "true" ] && [ -n "$CUSTOM_COMMIT" ]; then
              KSU_REF="$CUSTOM_COMMIT"
              KSU_URL="https://github.com/$REPO_URL2/commit/$CUSTOM_COMMIT"
              echo "BRANCH_INFO=custom" >> $GITHUB_ENV
            fi
          fi

          if [ -z "${KSU_REF:-}" ]; then
            COMMIT_HASH=$(git ls-remote $REPO_URL refs/heads/${KSU_BRANCH:-main} | awk '{ print $1 }')
            KSU_REF=$COMMIT_HASH
            KSU_URL="https://github.com/$REPO_URL2/commit/$COMMIT_HASH"
          fi

          echo "KSU_REF=$KSU_REF" >> $GITHUB_ENV
          echo "KSU_URL=$KSU_URL" >> $GITHUB_ENV

      # ==================== Fetch SUSFS commit info ====================
      # Fetch the Git commit info of SUSFS for each version
      - name: Fetch SUSFS commit info
        run: |
          GITLAB_OWNER="simonpunk"
          GITLAB_REPO="susfs4ksu"
          declare -A BRANCH_MAP=(
            ["gki_android12_5_10"]="gki-android12-5.10"
            ["gki_android13_5_15"]="gki-android13-5.15"
            ["gki_android14_6_1"]="gki-android14-6.1"
            ["gki_android15_6_6"]="gki-android15-6.6"
            ["gki_android16_6_12"]="gki-android16-6.12"
          )
          for var_name in "${!BRANCH_MAP[@]}"; do
            branch_name="${BRANCH_MAP[$var_name]}"
            COMMIT_HASH=$(git ls-remote https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO.git refs/heads/$branch_name | awk '{ print $1 }')
            if [[ -n "$COMMIT_HASH" ]]; then
              COMMIT_URL="https://gitlab.com/$GITLAB_OWNER/$GITLAB_REPO/-/commit/$COMMIT_HASH"
              echo "COMMIT_HASH_${var_name}=$COMMIT_HASH" >> "$GITHUB_ENV"
              echo "COMMIT_URL_${var_name}=$COMMIT_URL" >> "$GITHUB_ENV"
            fi
          done

      # ==================== Generate release notes ====================
      # Create a release-notes document with detailed info
      - name: Generate release notes
        run: |
          BUILD_DATE=$(date -u '+%Y-%m-%d %H:%M UTC')
          if [[ "$KSU_REF" =~ ^[0-9a-f]{40}$ ]]; then
            KSU_DISPLAY_REF="${KSU_REF:0:7}"
          else
            KSU_DISPLAY_REF="$KSU_REF"
          fi

          build_targets=""
          append_target() {
            local selected="$1" label="$2"
            if [[ "$selected" == "true" ]]; then
              if [[ -z "$build_targets" ]]; then
                build_targets="$label"
              else
                build_targets="$build_targets, $label"
              fi
            fi
          }
          append_target "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10"
          append_target "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15"
          append_target "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1"
          append_target "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6"
          append_target "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12"
          if [[ -z "$build_targets" ]]; then
            build_targets="none selected"
          fi

          : > susfs_commits.md
          append_susfs_commit() {
            local selected="$1" label="$2" hash="$3" url="$4"
            if [[ "$selected" == "true" && -n "$hash" && -n "$url" ]]; then
              printf -- '- %s: [`%s`](%s)\n' "$label" "${hash:0:7}" "$url" >> susfs_commits.md
            fi
          }
          append_susfs_commit "${{ inputs.build_a12_5_10 || inputs.build_all }}" "Android 12 / 5.10" "${COMMIT_HASH_gki_android12_5_10}" "${COMMIT_URL_gki_android12_5_10}"
          append_susfs_commit "${{ inputs.build_a13_5_15 || inputs.build_all }}" "Android 13 / 5.15" "${COMMIT_HASH_gki_android13_5_15}" "${COMMIT_URL_gki_android13_5_15}"
          append_susfs_commit "${{ inputs.build_a14_6_1 || inputs.build_all }}" "Android 14 / 6.1" "${COMMIT_HASH_gki_android14_6_1}" "${COMMIT_URL_gki_android14_6_1}"
          append_susfs_commit "${{ inputs.build_a15_6_6 || inputs.build_all }}" "Android 15 / 6.6" "${COMMIT_HASH_gki_android15_6_6}" "${COMMIT_URL_gki_android15_6_6}"
          append_susfs_commit "${{ inputs.build_a16_6_12 || inputs.build_all }}" "Android 16 / 6.12" "${COMMIT_HASH_gki_android16_6_12}" "${COMMIT_URL_gki_android16_6_12}"
          if [[ ! -s susfs_commits.md ]]; then
            echo "- No SUSFS commit info found for this build" > susfs_commits.md
          fi

          cat > release_body.md << EOF
          ## GKI Kernel Release

          **$KSU_NAME $KSU_VER** + **SUSFS $SUS_VER**

          | Item | Value |
          |:---|:---|
          | Release type | ${{ inputs.release_type }} |
          | Release time | $BUILD_DATE |
          | Build scope | $build_targets |

          ### Build configuration

          | Item | Value |
          |:---|:---|
          | KernelSU variant | $KSU_NAME |
          | KernelSU branch | $BRANCH_INFO |
          | SUSFS | $SUS_VER |
          | Hook type | $HOOK_TYPE |
          | Mount method | $MOUNT_TYPE |
          | LTO | thin |
          | BBG security patch | $BBG_STATUS |
          | ZRAM / LZ4KD | $LZ4_STATUS |
          | KPM | $KPM_STATUS |

          ### Download notes

          Download the corresponding files below under **Assets**.

          | File type | Purpose |
          |:---|:---|
          | \\`*_kernel-*.zip\\` | AnyKernel3 flashable kernel package |
          | \\`*.img\\` | boot, vendor_boot, and other image files |
          | \\`*.apk\\` | KernelSU manager |
          | \\`susfs-*.zip\\` | SUSFS companion module |

          > [!IMPORTANT]
          > Back up your stock Boot image before flashing.
          > If the device fails to boot, restore the stock image first, then pull KernelSU logs to report the issue.

          <details>
          <summary>Post-flash steps</summary>

          ### Boots normally

          After installing/updating the KernelSU manager, check that root, modules, and SUSFS status look correct.

          ### Fails to boot

          1. Restore the stock Boot image
          2. Pull logs via the KernelSU manager or recovery
          3. File an [Issue](https://github.com/zzh20188/GKI_KernelSU_SUSFS/issues) with device model, Android version, kernel version, and the flashed filename

          </details>

          <details>
          <summary>Upstream commit info</summary>

          **KernelSU**

          - $KSU_NAME: [\`$KSU_DISPLAY_REF\`]($KSU_URL)

          **SUSFS4KSU**

          $(cat susfs_commits.md)

          </details>

          ---

          Recommended module: https://github.com/sidex15/ksu_module_susfs

          For the Unicode zero-width bypass fix, use the Xposed module: https://t.me/real5ec1cff/268
          EOF

      # ==================== Generate version tag ====================
      # Generate an incrementing release tag based on the SUSFS version
      - name: Generate version tag
        run: |
          # Fetch the SUSFS version, use a default if get-manager was skipped
          SUS_VERSION="${{ needs.get-manager.outputs.susVer }}"
          if [ -z "$SUS_VERSION" ]; then
            echo "Warning: no SUSFS version found, using the default version number"
            SUS_VERSION="1.0.0"
          fi

          LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name' 2>/dev/null | sed 's/-.*//' || echo "")

          if [ "$SUS_VERSION" = "$LATEST_TAG" ]; then
            LATEST_TAG=$(gh api repos/$REPO_OWNER/$REPO_NAME/tags --jq '.[0].name')
          else
            LATEST_TAG="$SUS_VERSION-r0"
          fi

          NEW_TAG=$(echo "$LATEST_TAG" | awk -F'-r' '{suffix=$2; if (!suffix) suffix=0; suffix++; printf "%s-r%d", $1, suffix}')
          echo "NEW_TAG=$NEW_TAG" >> $GITHUB_ENV
          echo "Generated tag: $NEW_TAG"

      # ==================== Download build artifacts ====================
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: ./downloaded-artifacts

      # ==================== Create GitHub Release ====================
      - name: Create GitHub Release
        run: |
          PRERELEASE_FLAG=""
          if [ "${{ inputs.release_type }}" == "Pre-Release" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          gh release create "$NEW_TAG" \
            --title "$RELEASE_NAME" \
            --notes-file release_body.md \
            --target "$GITHUB_SHA" \
            $PRERELEASE_FLAG

      # ==================== Upload manager and modules ====================
      - name: Upload manager and mount-hiding modules
        continue-on-error: true
        run: |
          echo "Preparing to upload APK and mount-hiding modules..."
          apk_count=$(find ./downloaded-artifacts -type f -name "*.apk" | wc -l || true)
          sus_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" | wc -l || true)
          nomount_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/nomount-*/*" | wc -l || true)
          vpnhide_count=$(find ./downloaded-artifacts -type f -path "./downloaded-artifacts/*vpnhide-companion/*" | wc -l || true)
          echo "APK files: ${apk_count}"
          echo "SUSFS files: ${sus_count}"
          echo "NoMount files: ${nomount_count}"
          echo "VPNHide files: ${vpnhide_count}"
          find ./downloaded-artifacts -type f -name "*.apk" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/susfs-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/nomount-*/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done
          find ./downloaded-artifacts -type f -path "./downloaded-artifacts/*vpnhide-companion/*" -print0 | \
          while IFS= read -r -d '' f; do
            gh release upload "$NEW_TAG" "$f" || true
          done

      # ==================== Upload kernel artifacts ====================
      - name: Upload kernel artifacts
        run: |
          for file in ./downloaded-artifacts/*_kernel-*/*; do
            [ -d "$file" ] && continue
            # Skip files in the -Rejects directory (already aggregated in collect-rejects)
            [[ "$file" == *-Rejects/* ]] && continue
          echo "Uploading $file..."
            gh release upload "$NEW_TAG" "$file"
          done

      # ==================== Build summary ====================
      - name: Build summary
        run: |
          echo "## Release created" >> $GITHUB_STEP_SUMMARY
          echo "- **Tag**: $NEW_TAG" >> $GITHUB_STEP_SUMMARY
          echo "- **Type**: ${{ inputs.release_type }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Link**: https://github.com/$REPO_OWNER/$REPO_NAME/releases/tag/$NEW_TAG" >> $GITHUB_STEP_SUMMARY
