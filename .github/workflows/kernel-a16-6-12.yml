name: Kernel Build - Android 16 (6.12)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - Official
          - Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - XXKSU
        default: ReSukiSU
      susfs:
        description: "SUSFS mount hiding"
        required: false
        type: choice
        options:
          - "enabled"
          - "disabled"
        default: "enabled"
      nomount:
        description: "NoMount / Mountify mount hiding (metamodules)"
        required: false
        type: choice
        options:
          - "nomount (hookless)"
          - "nomount (ci)"
          - "mountify"
          - "disabled"
        default: "disabled"
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional, leave empty = current UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM support (patched mode not supported yet)"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (not supported yet)"
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "Upload AnyKernel3.zip only"
          - "Upload all"
        default: "Upload AnyKernel3.zip only"
      droidspaces_ntsync:
        description: "Enable NTSync support inside the Droidspaces container (requires Droidspaces)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable enhanced ZRAM algorithm"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG (Baseband Guard, anti-brick)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: false
      use_vpnhide:
        description: "Enable VPNHide Next (LSM-based VPN hiding)"
        required: false
        type: boolean
        default: false
      use_bbrv3:
        description: "Enable BBRv3 TCP congestion control backport (Android 14 - 6.1 build; no-op on other kernels)"
        required: false
        type: boolean
        default: false
      use_performance:
        description: "Enable performance patches (mem ops, scheduler, fs, wakelock tuning)"
        required: false
        type: boolean
        default: false
      supp_op:
        description: "OnePlus 8E support"
        required: false
        type: boolean
        default: false
  workflow_call:
    inputs:
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      susfs:
        required: false
        type: string
        default: "enabled"
      nomount:
        required: false
        type: string
        default: "disabled"
      use_vpnhide:
        required: false
        type: boolean
        default: false
      use_bbrv3:
        required: false
        type: boolean
        default: false
      use_performance:
        required: false
        type: boolean
        default: false
      supp_op:
        required: false
        type: boolean
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "Whether invoked from main.yml (internal)"
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a16-6-12:
    name: "6.12.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "23"
            os_patch_level: "2025-06"
          - sub_level: "30"
            os_patch_level: "2025-07"
          - sub_level: "38"
            os_patch_level: "2025-09"
          - sub_level: "58"
            os_patch_level: "2025-12"
          - sub_level: "69"
            os_patch_level: "2026-03"
          - sub_level: "81"
            os_patch_level: "2026-06"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android16"
      kernel_version: "6.12"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: false
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: ${{ inputs.supp_op || false }}
      enable_susfs: ${{ inputs.susfs == 'enabled' }}
      enable_nomount: ${{ inputs.nomount == 'nomount (hookless)' || inputs.nomount == 'nomount (ci)' }}
      nomount_variant: ${{ contains(inputs.nomount, 'ci') && 'ci' || 'hookless' }}
      use_vpnhide: ${{ inputs.use_vpnhide }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}
      use_performance: ${{ inputs.use_performance }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # Runs only on direct dispatch; skipped when called from main.yml
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      susfs: ${{ inputs.susfs || 'enabled' }}
      nomount: ${{ inputs.nomount || 'disabled' }}
      use_vpnhide: ${{ inputs.use_vpnhide || false }}
