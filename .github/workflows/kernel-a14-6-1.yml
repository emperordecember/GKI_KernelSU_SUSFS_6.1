name: Kernel Build - Android 14 (6.1)

permissions:
  contents: write
  actions: write

on:
  workflow_dispatch:
    inputs:
      kernel_source:
        description: "Kernel source"
        required: true
        type: choice
        options:
          - "Original (GKI common)"
          - "Sultan (Pixel Tensor G4 / zumapro)"
          - "Sultan (Pixel Tensor G4 / tegu)"
        default: "Original (GKI common)"
      kernelsu_variant:
        description: "KernelSU variant"
        required: true
        type: choice
        options:
          - Official
          - Next
          - SukiSU
          - SukiSU(40726)
          - SukiSU(40548)
          - ReSukiSU
          - XXKSU
        default: ReSukiSU
      version:
        description: "Custom version name (optional)"
        required: false
        type: string
      build_time:
        description: "Custom build time (optional, leave empty = current UTC)"
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_kpm:
        description: "KPM support (patched mode not supported yet)"
        required: true
        type: choice
        default: "disabled"
        options:
          - "disabled"
          - "enabled"
          - "patched (not supported yet)"
      droidspaces:
        description: "Droidspaces container support"
        required: false
        type: choice
        options:
          - "off"
          - "678"
          - "123"
          - "345"
        default: "off"
      artifact_upload_mode:
        description: "Build artifact upload mode"
        required: true
        type: choice
        options:
          - "AnyKernel3.zip only"
          - "Upload all"
        default: "AnyKernel3.zip only"
      droidspaces_ntsync:
        description: "Enable NTSync support inside the Droidspaces container (requires Droidspaces)"
        required: false
        type: boolean
        default: false
      use_zram:
        description: "Enable enhanced ZRAM algorithm (forced off automatically for ReSukiSU — see note below, known bootloop bug)"
        required: true
        type: boolean
        default: false
      use_bbg:
        description: "Enable BBG (Baseband Guard, anti-brick)"
        required: true
        type: boolean
        default: false
      use_rekernel:
        description: "Enable Re-Kernel driver"
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        description: "Apply CVE-2026-43499 rtmutex fix chain"
        required: false
        type: boolean
        default: false
      use_bbrv3:
        description: "Enable BBRv3 TCP congestion control backport (android14-6.1; GKI common path only, warning no-op on Sultan path)"
        required: false
        type: boolean
        default: false
      mount_hiding:
        description: "Mount hiding engine"
        required: false
        type: choice
        options:
          - "susfs"
          - "nomount"
          - "nomount(hookless)"
          - "none"
        default: "susfs"
  workflow_call:
    inputs:
      kernel_source:
        required: false
        type: string
        default: "Original (GKI common)"
      kernelsu_variant:
        required: true
        type: string
      version:
        required: false
        type: string
      build_time:
        required: false
        type: string
        default: "Sun Dec 01 08:10:00 UTC 2024"
      use_zram:
        required: true
        type: boolean
      use_bbg:
        required: true
        type: boolean
      use_kpm:
        required: true
        type: string
      use_rekernel:
        required: false
        type: boolean
        default: false
      cve_2026_43499_patch:
        required: false
        type: boolean
        default: false
      mount_hiding:
        required: false
        type: string
        default: "susfs"
      droidspaces:
        required: false
        type: string
        default: "off"
      artifact_upload_mode:
        required: false
        type: string
        default: "Upload all"
      droidspaces_ntsync:
        required: false
        type: boolean
        default: false
      called_from_main:
        description: "Whether this was invoked from main.yml (internal use)"
        required: false
        type: boolean
        default: false
      use_bbrv3:
        required: false
        type: boolean
        default: false

jobs:
  build-kernels-a14-6-1:
    name: "6.1.${{ matrix.sub_level }}-${{ matrix.os_patch_level }}"
    if: inputs.kernel_source != 'Sultan (Pixel Tensor G4 / zumapro)' && inputs.kernel_source != 'Sultan (Pixel Tensor G4 / tegu)'
    strategy:
      fail-fast: false
      matrix:
        include:
          - sub_level: "145"
            os_patch_level: "2025-09"
          - sub_level: "157"
            os_patch_level: "2025-12"
          - sub_level: "162"
            os_patch_level: "2026-03"
          - sub_level: "X"
            os_patch_level: "lts"
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      android_version: "android14"
      kernel_version: "6.1"
      sub_level: ${{ matrix.sub_level }}
      os_patch_level: ${{ matrix.os_patch_level }}
      ksu_variant: ${{ inputs.kernelsu_variant }}
      version: ${{ inputs.version || '' }}
      build_time: ${{ inputs.build_time || '' }}
      use_zram: ${{ inputs.use_zram }}
      use_bbg: ${{ inputs.use_bbg }}
      use_kpm: ${{ inputs.use_kpm }}
      use_rekernel: ${{ inputs.use_rekernel || false }}
      cve_2026_43499_patch: ${{ inputs.cve_2026_43499_patch }}
      supp_op: false
      enable_susfs: ${{ inputs.mount_hiding == 'susfs' }}
      enable_nomount: ${{ inputs.mount_hiding == 'nomount' || inputs.mount_hiding == 'nomount(hookless)' }}
      nomount_variant: ${{ contains(inputs.mount_hiding, 'hookless') && 'hookless' || 'dev' }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}
      droidspaces: ${{ inputs.droidspaces || 'off' }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      artifact_upload_mode: ${{ inputs.artifact_upload_mode }}

  # Sultan kernel source (kerneltoast/android_kernel_google_tensynos), fixed to the
  # zumapro codename -- that's the Tensor G4 (Pixel 9/9 Pro/9 Pro XL/9 Pro Fold) chip.
  # Root manager choice reuses the same kernelsu_variant input as the Original build,
  # but only "Next" (KernelSU-Next) is a combination actually verified against this
  # device tree's hand-built compat patches -- see comments in sultan.yml.
  build-sultan-kernel:
    name: "Sultan-zumapro-${{ inputs.kernelsu_variant }}"
    if: inputs.kernel_source == 'Sultan (Pixel Tensor G4 / zumapro)'
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "zumapro"
      android_version: "android14"
      kernel_version: "6.1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      use_bbg: ${{ inputs.use_bbg }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      mount_hiding: ${{ inputs.mount_hiding || 'susfs' }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}

  # Pixel 9a (tegu): built from etnperlong's Sultan-based tegu port (6.1.157) via
  # the same sultan.yml pipeline. tegu's vendor_kernel_boot dtb payload is the same
  # set of base zumapro dtbs (the tegu-specific overlay lives in the untouched
  # stock dtbo partition, selected by ro.boot.dtbo_idx), and anykernel.sh is sed'ed
  # to the tegu device inside sultan.yml. The hand-built .github/patches/sultan/
  # hooks are verified on 6.1.157 (fuzz=0): susfs clean, selinux-export clean,
  # droidspaces uses the tegu-specific variant (sched.h + zumapro_defconfig only).
  build-sultan-tegu-kernel:
    name: "Sultan-tegu-${{ inputs.kernelsu_variant }}"
    if: inputs.kernel_source == 'Sultan (Pixel Tensor G4 / tegu)'
    uses: ./.github/workflows/sultan.yml
    secrets: inherit
    with:
      codename: "tegu"
      android_version: "android14"
      kernel_version: "6.1"
      ksu_variant: ${{ inputs.kernelsu_variant }}
      use_bbg: ${{ inputs.use_bbg }}
      droidspaces_ntsync: ${{ inputs.droidspaces_ntsync || false }}
      mount_hiding: ${{ inputs.mount_hiding || 'susfs' }}
      use_bbrv3: ${{ inputs.use_bbrv3 }}

  # Only runs on direct trigger, skipped when called from main.yml.
  # Runs for both Original and Sultan builds -- get-manager.yml handles the
  # "Next" variant used by Sultan just as well as the others.
  get-ksu-manager:
    if: ${{ !inputs.called_from_main }}
    uses: ./.github/workflows/get-manager.yml
    secrets: inherit
    with:
      kernelsu_variant: ${{ inputs.kernelsu_variant }}
      mount_hiding: ${{ inputs.mount_hiding }}
